<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常智慧時程幫手 | Focus Flow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FDFBF7;
            color: #4A453F;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between py-8 px-4 sm:px-6">

    <!-- 主容器：雙欄響應式網格 -->
    <div class="max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

        <!-- 左側欄位：月曆與資料備份 (md:col-span-4) -->
        <aside class="md:col-span-4 space-y-6">

            <!-- 品牌與標題 -->
            <div class="text-center md:text-left space-y-1 px-1">
                <h1 class="text-xl font-semibold tracking-wide text-[#5C5346]">日常智慧時程幫手</h1>
                <p class="text-xs text-[#8C8275]">今天過得還好嗎？寫下一件想完成的小事吧 🌿</p>
            </div>

            <!-- 日系月曆卡片 -->
            <div class="bg-white border border-[#E5DFD3] rounded-2xl p-4 shadow-2xs space-y-4">
                <div class="flex items-center justify-between">
                    <h2 id="calendar-month-year" class="text-sm font-semibold text-[#5C5346]">2026年 10月</h2>
                    <div class="flex space-x-1">
                        <button onclick="changeMonth(-1)"
                            class="p-1 hover:bg-[#F2F0EB] rounded-lg text-xs text-[#8C8275] cursor-pointer">&larr;</button>
                        <button onclick="changeMonth(1)"
                            class="p-1 hover:bg-[#F2F0EB] rounded-lg text-xs text-[#8C8275] cursor-pointer">&rarr;</button>
                    </div>
                </div>

                <!-- 星期標題 -->
                <div class="grid grid-cols-7 text-center text-xs text-[#B3AAA0] font-medium">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>

                <!-- 日期格子 -->
                <div id="calendar-days" class="grid grid-cols-7 gap-y-1 text-center text-xs">
                    <!-- JS 動態生成 -->
                </div>

                <div class="pt-2 border-t border-[#F2F0EB] flex justify-between items-center text-xs">
                    <span id="selected-date-display" class="text-[#8C8275]">選定日期: 今日</span>
                    <button onclick="resetToToday()" class="text-[#5C5346] hover:underline cursor-pointer">回到今天</button>
                </div>
            </div>

            <!-- 資料備份與還原 (Local-First 專屬功能) -->
            <div class="bg-[#F2F0EB] border border-[#E5DFD3] rounded-2xl p-4 space-y-3">
                <h3 class="text-xs font-semibold text-[#5C5346] flex items-center space-x-1">
                    <span>🔒</span>
                    <span>隱私與本地資料管理</span>
                </h3>
                <p class="text-xs text-[#8C8275] leading-relaxed">
                    所有資料僅存於您的瀏覽器。您可以隨時匯出備份或還原檔案。
                </p>
                <div class="flex space-x-2 pt-1">
                    <button onclick="exportData()"
                        class="flex-1 bg-white border border-[#E5DFD3] hover:bg-[#F9F6F0] text-[#5C5346] text-xs py-2 rounded-xl font-medium transition cursor-pointer shadow-2xs">
                        📥 匯出備份
                    </button>
                    <label
                        class="flex-1 bg-white border border-[#E5DFD3] hover:bg-[#F9F6F0] text-[#5C5346] text-xs py-2 rounded-xl font-medium transition cursor-pointer shadow-2xs text-center inline-block">
                        📤 還原資料
                        <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
            </div>

        </aside>

        <!-- 右側欄位：主互動區 (md:col-span-8) -->
        <main class="md:col-span-8 space-y-6">

            <!-- 儀表板：今日總時程統計 -->
            <div
                class="bg-[#F2F0EB] border border-[#E5DFD3] rounded-2xl p-4 flex items-center justify-between shadow-2xs">
                <div class="flex items-center space-x-3">
                    <span class="text-xl">⏱️</span>
                    <div>
                        <h2 class="text-xs text-[#8C8275] font-medium">當前選定日期總時程</h2>
                        <p id="total-focus-time" class="text-lg font-semibold text-[#4A453F]">0 分鐘</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="task-count-badge"
                        class="text-xs bg-[#E5DFD3] text-[#5C5346] px-2.5 py-1 rounded-full font-medium">0 項待辦</span>
                </div>
            </div>

            <!-- 快速直覺輸入列 -->
            <div class="bg-white border border-[#E5DFD3] rounded-2xl p-3 shadow-2xs flex items-center space-x-2">
                <input id="task-input" type="text" placeholder="例如：英文報告兩小時、買咖啡 15m..."
                    class="flex-1 bg-transparent px-3 py-2 text-sm focus:outline-none placeholder-[#B3AAA0] text-[#4A453F]">
                <button onclick="addNewTask()"
                    class="bg-[#8C8275] hover:bg-[#736A5E] text-white px-5 py-2.5 rounded-xl text-sm font-medium transition duration-200 cursor-pointer shadow-xs">
                    新增
                </button>
            </div>

            <!-- 區塊 A：今日核心焦點 -->
            <section class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-sm font-semibold text-[#5C5346] flex items-center space-x-1.5">
                        <span>🌱</span>
                        <span>核心焦點</span>
                    </h3>
                    <span class="text-xs text-[#8C8275]">點擊時間標籤可手動修改</span>
                </div>
                <div id="focus-tasks-container" class="space-y-3"></div>
                <div id="focus-empty"
                    class="hidden text-center py-6 border border-dashed border-[#E5DFD3] rounded-2xl text-xs text-[#A69E93]">
                    此日期目前沒有核心焦點任務 ✨
                </div>
            </section>

            <!-- 區塊 B：後續待辦清單 -->
            <section class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-sm font-semibold text-[#5C5346] flex items-center space-x-1.5">
                        <span>☁️</span>
                        <span>後續待辦清單</span>
                    </h3>
                </div>
                <div id="backlog-tasks-container" class="space-y-3"></div>
                <div id="backlog-empty"
                    class="hidden text-center py-6 border border-dashed border-[#E5DFD3] rounded-2xl text-xs text-[#A69E93]">
                    後續待辦清單空空如也，真棒！
                </div>
            </section>

            <!-- 區塊 C：已完成歷史清單 -->
            <section class="space-y-3 pt-4 border-t border-[#E5DFD3]">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-sm font-semibold text-[#8C8275] flex items-center space-x-1.5">
                        <span>🎉</span>
                        <span>已完成歷史清單</span>
                    </h3>
                    <button onclick="clearCompleted()"
                        class="text-xs text-[#A69E93] hover:text-[#736A5E] underline cursor-pointer">清空歷史</button>
                </div>
                <div id="completed-tasks-container" class="space-y-2"></div>
                <div id="completed-empty" class="text-center py-4 text-xs text-[#B3AAA0]">
                    尚無已完成的任務 😊
                </div>
            </section>

        </main>

    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-xs text-[#A69E93] pt-12 pb-4">
        <p>Focus Flow &copy; 2026 &bull; Local-First Privacy Protected</p>
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('focus_flow_tasks')) || [];

        // 日曆與選定日期狀態
        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); // 0-11
        let selectedDateStr = formatDateStr(today); // "YYYY-MM-DD"

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            renderTasks();
            document.getElementById('task-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addNewTask();
                }
            });
        });

        function formatDateStr(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 月曆切換
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function resetToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            selectedDateStr = formatDateStr(now);
            renderCalendar();
            renderTasks();
        }

        // 渲染左側日系月曆
        function renderCalendar() {
            const monthYearEl = document.getElementById('calendar-month-year');
            const daysContainer = document.getElementById('calendar-days');
            const selectedDisplay = document.getElementById('selected-date-display');

            monthYearEl.innerText = `${currentYear}年 ${currentMonth + 1}月`;
            selectedDisplay.innerText = `選定: ${selectedDateStr}`;
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 空白補齊
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                daysContainer.appendChild(emptyDiv);
            }

            // 渲染日期
            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                const dateStr = formatDateStr(dateObj);

                const dayBtn = document.createElement('button');
                dayBtn.className = "h-8 w-8 mx-auto rounded-full flex flex-col items-center justify-center text-xs transition relative cursor-pointer";

                const isSelected = (dateStr === selectedDateStr);
                const isToday = (dateStr === formatDateStr(new Date()));

                if (isSelected) {
                    dayBtn.className += " bg-[#8C8275] text-white font-medium shadow-2xs";
                } else if (isToday) {
                    dayBtn.className += " border border-[#8C8275] text-[#5C5346] font-medium";
                } else {
                    dayBtn.className += " hover:bg-[#F2F0EB] text-[#4A453F]";
                }

                dayBtn.innerText = d;

                // 檢查該日是否有未完成任務，加上小圓點
                const hasActiveTasks = tasks.some(t => t.date === dateStr && !t.completed);
                if (hasActiveTasks && !isSelected) {
                    const dot = document.createElement('span');
                    dot.className = "absolute bottom-1 w-1 h-1 bg-[#8C8275] rounded-full";
                    dayBtn.appendChild(dot);
                }

                dayBtn.onclick = () => {
                    selectedDateStr = dateStr;
                    renderCalendar();
                    renderTasks();
                };

                daysContainer.appendChild(dayBtn);
            }
        }

        // 時間解析器
        function parseTaskInput(rawText) {
            let text = rawText.trim();
            let durationMinutes = 30;

            const wordMap = {
                '半': 0.5, '一': 1, '兩': 2, '三': 3, '四': 4,
                '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10
            };

            const patterns = [
                { regex: /(\d+|[一兩半三四五六七八九十]+)\s*(週|周|week|weeks)/i, multiplier: 7 * 24 * 60 },
                { regex: /(\d+|[一兩半三四五六七八九十]+)\s*(天|日|day|days)/i, multiplier: 24 * 60 },
                { regex: /(\d+\.?\d*|[一兩半三四五六七八九十]+)\s*(h|hr|hrs|小時)/i, multiplier: 60 },
                { regex: /(\d+|[一兩半三四五六七八九十]+)\s*(m|min|mins|分鐘|分)/i, multiplier: 1 }
            ];

            let matched = false;
            for (let p of patterns) {
                let match = text.match(p.regex);
                if (match) {
                    let rawVal = match[1];
                    let val = wordMap[rawVal] !== undefined ? wordMap[rawVal] : parseFloat(rawVal);
                    if (!isNaN(val)) {
                        durationMinutes = Math.round(val * p.multiplier);
                        let cleanedText = text.replace(match[0], '').trim();
                        if (cleanedText.length > 0) text = cleanedText;
                        matched = true;
                        break;
                    }
                }
            }

            if (!matched) {
                const lowerText = text.toLowerCase();
                if (lowerText.includes('簡報') || lowerText.includes('報告') || lowerText.includes('專案') || lowerText.includes('讀書')) {
                    durationMinutes = 60;
                } else if (lowerText.includes('回信') || lowerText.includes('買') || lowerText.includes('拿')) {
                    durationMinutes = 15;
                } else {
                    durationMinutes = 30;
                }
            }

            text = text.replace(/[\s]+/g, ' ');
            if (!text) text = "未命名任務";
            return { title: text, duration: durationMinutes };
        }

        function formatDuration(mins) {
            if (mins >= 1440) {
                return `${(mins / 1440).toFixed(1).replace('.0', '')} 天`;
            } else if (mins >= 60) {
                return `${(mins / 60).toFixed(1).replace('.0', '')} 小時`;
            } else {
                return `${mins} 分鐘`;
            }
        }

        function editTaskDuration(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            const inputVal = prompt(`請輸入「${task.title}」的新工作時長\n(例如：30分鐘、1.5小時、2天):`, formatDuration(task.duration));
            if (inputVal === null) return;
            const parsed = parseTaskInput(inputVal);
            task.duration = parsed.duration;
            saveAndRender();
        }

        // 新增任務 (綁定當前選定日期)
        function addNewTask() {
            const input = document.getElementById('task-input');
            const rawValue = input.value.trim();
            if (!rawValue) return;

            const parsed = parseTaskInput(rawValue);

            const newTask = {
                id: Date.now(),
                title: parsed.title,
                duration: parsed.duration,
                date: selectedDateStr, // 綁定月曆選定日
                completed: false,
                manualPlacement: null,
                createdAt: Date.now()
            };

            tasks.unshift(newTask);
            input.value = '';
            saveAndRender();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function moveTaskPlacement(id, targetPlacement) {
            tasks = tasks.map(t => t.id === id ? { ...t, manualPlacement: targetPlacement } : t);
            saveAndRender();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !(t.date === selectedDateStr && t.completed));
            saveAndRender();
        }

        // 匯出備份 JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `focus_flow_backup_${formatDateStr(new Date())}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 還原資料 JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        tasks = imported;
                        saveAndRender();
                        alert("資料還原成功！ 🌿");
                    } else {
                        alert("檔案格式不符");
                    }
                } catch (err) {
                    alert("解析 JSON 檔案失敗");
                }
            };
            reader.readAsText(file);
        }

        function saveAndRender() {
            localStorage.setItem('focus_flow_tasks', JSON.stringify(tasks));
            renderCalendar();
            renderTasks();
        }

        function renderTasks() {
            const focusContainer = document.getElementById('focus-tasks-container');
            const backlogContainer = document.getElementById('backlog-tasks-container');
            const completedContainer = document.getElementById('completed-tasks-container');

            const focusEmpty = document.getElementById('focus-empty');
            const backlogEmpty = document.getElementById('backlog-empty');
            const completedEmpty = document.getElementById('completed-empty');

            const totalFocusTimeEl = document.getElementById('total-focus-time');
            const taskCountBadge = document.getElementById('task-count-badge');

            focusContainer.innerHTML = '';
            backlogContainer.innerHTML = '';
            completedContainer.innerHTML = '';

            // 只篩選出符合當前「選定日期」的任務
            const dateTasks = tasks.filter(t => t.date === selectedDateStr || (!t.date && selectedDateStr === formatDateStr(new Date())));
            const activeTasks = dateTasks.filter(t => !t.completed);
            const completedTasks = dateTasks.filter(t => t.completed);

            taskCountBadge.innerText = `${activeTasks.length} 項待辦`;

            let sortedActive = [...activeTasks].sort((a, b) => a.duration - b.duration);

            let focusList = [];
            let backlogList = [];

            sortedActive.forEach((task) => {
                if (task.manualPlacement === 'focus') {
                    focusList.push(task);
                } else if (task.manualPlacement === 'backlog') {
                    backlogList.push(task);
                } else {
                    if (focusList.length < 3) {
                        focusList.push(task);
                    } else {
                        backlogList.push(task);
                    }
                }
            });

            let totalMins = focusList.reduce((sum, t) => sum + t.duration, 0);
            totalFocusTimeEl.innerText = formatDuration(totalMins);

            if (focusList.length === 0) {
                focusEmpty.classList.remove('hidden');
            } else {
                focusEmpty.classList.add('hidden');
                focusList.forEach(task => focusContainer.appendChild(createTaskCard(task, 'focus')));
            }

            if (backlogList.length === 0) {
                backlogEmpty.classList.remove('hidden');
            } else {
                backlogEmpty.classList.add('hidden');
                backlogList.forEach(task => backlogContainer.appendChild(createTaskCard(task, 'backlog')));
            }

            if (completedTasks.length === 0) {
                completedEmpty.classList.remove('hidden');
            } else {
                completedEmpty.classList.add('hidden');
                completedTasks.forEach(task => completedContainer.appendChild(createCompletedCard(task)));
            }
        }

        function createTaskCard(task, currentSection) {
            const card = document.createElement('div');
            card.className = "bg-white border border-[#E5DFD3] rounded-2xl p-3.5 flex items-center justify-between shadow-2xs hover:border-[#D4CBBF] transition duration-200";

            const leftDiv = document.createElement('div');
            leftDiv.className = "flex items-center space-x-3 flex-1 min-w-0 pr-3";

            const checkbox = document.createElement('input');
            checkbox.type = "checkbox";
            checkbox.className = "w-4 h-4 rounded border-[#D4CBBF] text-[#8C8275] focus:ring-0 cursor-pointer accent-[#8C8275]";
            checkbox.onchange = () => toggleTask(task.id);

            const titleSpan = document.createElement('span');
            titleSpan.className = "text-sm text-[#4A453F] truncate font-medium";
            titleSpan.innerText = task.title;

            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(titleSpan);

            const rightDiv = document.createElement('div');
            rightDiv.className = "flex items-center space-x-2 shrink-0";

            const timeBadge = document.createElement('button');
            timeBadge.className = "text-xs bg-[#F2F0EB] hover:bg-[#E5DFD3] text-[#736A5E] px-2.5 py-1 rounded-full font-medium transition cursor-pointer";
            timeBadge.innerText = `⏱ ${formatDuration(task.duration)}`;
            timeBadge.title = "點擊可手動修改時間";
            timeBadge.onclick = () => editTaskDuration(task.id);

            rightDiv.appendChild(timeBadge);

            const moveBtn = document.createElement('button');
            moveBtn.className = "text-xs text-[#8C8275] hover:text-[#4A453F] bg-[#F9F6F0] border border-[#E5DFD3] px-2 py-1 rounded-lg transition cursor-pointer";
            if (currentSection === 'focus') {
                moveBtn.innerText = "移至後續 ☁️";
                moveBtn.onclick = () => moveTaskPlacement(task.id, 'backlog');
            } else {
                moveBtn.innerText = "移至焦點 🌱";
                moveBtn.onclick = () => moveTaskPlacement(task.id, 'focus');
            }
            rightDiv.appendChild(moveBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = "text-xs text-[#B3AAA0] hover:text-red-500 px-1.5 py-1 transition cursor-pointer";
            deleteBtn.innerHTML = "&times;";
            deleteBtn.onclick = () => deleteTask(task.id);
            rightDiv.appendChild(deleteBtn);

            card.appendChild(leftDiv);
            card.appendChild(rightDiv);

            return card;
        }

        function createCompletedCard(task) {
            const card = document.createElement('div');
            card.className = "bg-[#F9F6F0] border border-[#EFECE6] rounded-xl p-3 flex items-center justify-between opacity-80";

            const leftDiv = document.createElement('div');
            leftDiv.className = "flex items-center space-x-3 flex-1 min-w-0 pr-3";

            const checkbox = document.createElement('input');
            checkbox.type = "checkbox";
            checkbox.checked = true;
            checkbox.className = "w-4 h-4 rounded border-[#D4CBBF] text-[#8C8275] focus:ring-0 cursor-pointer accent-[#8C8275]";
            checkbox.onchange = () => toggleTask(task.id);

            const titleSpan = document.createElement('span');
            titleSpan.className = "text-sm text-[#8C8275] line-through truncate";
            titleSpan.innerText = task.title;

            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(titleSpan);

            const rightDiv = document.createElement('div');
            rightDiv.className = "flex items-center space-x-2 shrink-0";

            const successLabel = document.createElement('span');
            successLabel.className = "text-xs text-[#9E9487] font-medium";
            successLabel.innerText = "已完成 🎉";

            const deleteBtn = document.createElement('button');
            deleteBtn.className = "text-xs text-[#B3AAA0] hover:text-red-500 px-1.5 py-1 transition cursor-pointer";
            deleteBtn.innerHTML = "&times;";
            deleteBtn.onclick = () => deleteTask(task.id);

            rightDiv.appendChild(successLabel);
            rightDiv.appendChild(deleteBtn);

            card.appendChild(leftDiv);
            card.appendChild(rightDiv);

            return card;
        }
    </script>
</body>

</html>
