<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常智慧時程幫手 | Focus Flow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F9F6F0; /* 日系無印米白色 */
            color: #4A453F; /* 沉穩炭灰褐色 */
        }
        /* 自定義滑動條與過渡效果 */
        .transition-all-custom {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#E5DFD3]">

    <!-- 頂部導航列 -->
    <header class="w-full bg-[#FDFBF7] border-b border-[#E5DFD3] py-4 px-6 shadow-xs sticky top-0 z-10">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 rounded-full bg-[#B8A89A]"></span>
                <h1 class="text-lg font-semibold tracking-wide text-[#5C534A]">日常智慧時程幫手</h1>
            </div>
            <div class="text-xs text-[#8C8275] bg-[#F2F0EB] px-3 py-1.5 rounded-full border border-[#E5DFD3]">
                本地隱私保護 · 智能排序中
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-2xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- 統計儀表板 -->
        <section class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-[#F2F0EB] p-4 rounded-xl border border-[#E5DFD3] shadow-xs flex flex-col justify-between">
                <span class="text-xs text-[#8C8275] font-medium">今日預計總花費時程</span>
                <div class="flex items-baseline space-x-1 mt-2">
                    <span id="total-time-display" class="text-2xl font-semibold text-[#4A453F]">0</span>
                    <span class="text-sm text-[#8C8275]">分鐘</span>
                </div>
            </div>
            <div class="bg-[#F2F0EB] p-4 rounded-xl border border-[#E5DFD3] shadow-xs flex flex-col justify-between">
                <span class="text-xs text-[#8C8275] font-medium">待辦完成進度</span>
                <div class="flex items-baseline space-x-1 mt-2">
                    <span id="progress-display" class="text-2xl font-semibold text-[#4A453F]">0 / 0</span>
                    <span class="text-sm text-[#8C8275]">已完成</span>
                </div>
            </div>
        </section>

        <!-- 快速輸入列 -->
        <section class="bg-[#FDFBF7] p-4 sm:p-5 rounded-2xl border border-[#E5DFD3] shadow-xs mb-8">
            <form id="todo-form" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <input 
                        type="text" 
                        id="todo-input" 
                        placeholder="例如：英文報告兩小時、開會 30m、回信..." 
                        class="w-full bg-[#F9F6F0] border border-[#E5DFD3] rounded-xl px-4 py-3 text-sm text-[#4A453F] placeholder-[#A39B90] focus:outline-none focus:border-[#8C8275] transition-all-custom"
                        autocomplete="off"
                    >
                </div>
                <button 
                    type="submit" 
                    class="bg-[#786D60] hover:bg-[#5C534A] text-[#FDFBF7] px-6 py-3 rounded-xl text-sm font-medium transition-all-custom cursor-pointer flex items-center justify-center space-x-1 shadow-xs"
                >
                    <span>新增事項</span>
                </button>
            </form>
            <div class="mt-2.5 px-1 text-xs text-[#9E9487] flex items-center justify-between">
                <span>💡 提示：支援中英文縮寫（如：1h, 30分鐘, 兩小時），系統將自動解析。</span>
            </div>
        </section>

        <!-- 今日焦點區塊 (Top 3) -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-sm font-semibold tracking-wider text-[#786D60] uppercase">⭐ 今日核心焦點 (Top 3 推薦優先)</h2>
            </div>
            <div id="focus-list" class="space-y-3">
                <!-- 動態插入 -->
            </div>
        </section>

        <!-- 後續待辦清單 -->
        <section class="mb-10">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-sm font-semibold tracking-wider text-[#786D60] uppercase">📋 後續待辦清單</h2>
            </div>
            <div id="pending-list" class="space-y-3">
                <!-- 動態插入 -->
            </div>
        </section>

        <!-- 已完成歷史清單 -->
        <section>
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-sm font-semibold tracking-wider text-[#9E9487] uppercase">✨ 已完成歷史紀錄</h2>
                <button id="clear-history" class="text-xs text-[#9E9487] hover:text-[#786D60] underline cursor-pointer">清除紀錄</button>
            </div>
            <div id="completed-list" class="space-y-2">
                <!-- 動態插入 -->
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="w-full bg-[#FDFBF7] border-t border-[#E5DFD3] py-4 text-center text-xs text-[#9E9487]">
        <p>Focus Flow · 日常智慧時程幫手 (Local-First 安全架構)</p>
    </footer>

    <!-- JavaScript 邏輯與演算法 -->
    <script>
        // 初始化資料狀態
        let todos = JSON.parse(localStorage.getItem('focus_flow_todos')) || [];

        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const focusList = document.getElementById('focus-list');
        const pendingList = document.getElementById('pending-list');
        const completedList = document.getElementById('completed-list');
        const totalTimeDisplay = document.getElementById('total-time-display');
        const progressDisplay = document.getElementById('progress-display');
        const clearHistoryBtn = document.getElementById('clear-history');

        // 時間與中文數字轉換與解析演算法 (機制二：Regex 縮寫解析)
        function parseDurationAndTitle(rawText) {
            let title = rawText.trim();
            let duration = 30; // 預設 30 分鐘

            // 英文縮寫與數字正則表達式 (例如: 1.5h, 30m, 45mins, 2hrs)
            const engRegex = /(\d+(?:\.\d+)?)\s*(h|hr|hrs|m|min|mins)\b/i;
            const engMatch = title.match(engRegex);

            if (engMatch) {
                const val = parseFloat(engMatch[1]);
                const unit = engMatch[2].toLowerCase();
                if (unit.startsWith('h')) {
                    duration = Math.round(val * 60);
                } else {
                    duration = Math.round(val);
                }
                title = title.replace(engRegex, '').trim();
            } else {
                // 中文時間正則表達式 (例如: 兩小時, 半小時, 30分鐘, 1.5小時)
                const cnRegex = /([零一二兩三四五六七八九十百]+|\d+(?:\.\d+)?)\s*(小時|鐘頭|分鐘|分)/;
                const cnMatch = title.match(cnRegex);

                if (cnMatch) {
                    const numStr = cnMatch[1];
                    const unitStr = cnMatch[2];
                    let val = parseFloat(numStr);

                    if (isNaN(val)) {
                        const cnNums = { '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '半': 0.5 };
                        if (numStr === '半') val = 0.5;
                        else if (cnNums[numStr] !== undefined) val = cnNums[numStr];
                        else if (numStr.startsWith('十')) {
                            val = numStr.length === 1 ? 10 : 10 + (cnNums[numStr[1]] || 0);
                        }
                    }

                    if (unitStr.includes('小時') || unitStr.includes('鐘頭')) {
                        duration = Math.round(val * 60);
                    } else {
                        duration = Math.round(val);
                    }
                    title = title.replace(cnRegex, '').trim();
                } else {
                    // 機制一：關鍵字對應表智慧預估
                    const lowerTitle = title.toLowerCase();
                    if (lowerTitle.includes('報告') || lowerTitle.includes('簡報') || lowerTitle.includes('專案') || lowerTitle.includes('讀書') || lowerTitle.includes('運動')) {
                        duration = 60;
                    } else if (lowerTitle.includes('回信') || lowerTitle.includes('買') || lowerTitle.includes('拿') || lowerTitle.includes('確認') || lowerTitle.includes('簽名')) {
                        duration = 15;
                    } else {
                        duration = 30; // 標準預設
                    }
                }
            }

            // 清理標題多餘空格
            title = title.replace(/\s+/g, ' ');
            if (!title) title = '未命名日常任務';

            return { title, duration };
        }

        // 自動排序與智慧評分演算法 (艾森豪矩陣與CP值輕量化概念)
        function calculateScore(todo) {
            // 基礎分：由時長與簡單關鍵字（如急、deadline、明天）賦予權重
            let urgencyScore = 10;
            const lowerTitle = todo.title.toLowerCase();
            if (lowerTitle.includes('急') || lowerTitle.includes('deadline') || lowerTitle.includes('今天') || lowerTitle.includes('立刻')) {
                urgencyScore = 30;
            }

            // CP 值運算：時間越短且具備急迫性的任務，優先權適度提高讓用戶輕鬆解鎖 (Quick Wins)
            let score = urgencyScore - (todo.duration * 0.05);
            return score;
        }

        // 儲存至 LocalStorage
        function saveTodos() {
            localStorage.setItem('focus_flow_todos', JSON.stringify(todos));
        }

        // 渲染畫面
        function render() {
            focusList.innerHTML = '';
            pendingList.innerHTML = '';
            completedList.innerHTML = '';

            // 篩選未完成與已完成
            const activeTodos = todos.filter(t => !t.completed);
            const completedTodos = todos.filter(t => t.completed);

            // 計算今日總預計花費時程 (僅計算未完成)
            const totalMinutes = activeTodos.reduce((sum, t) => sum + t.duration, 0);
            const hours = (totalMinutes / 60).toFixed(1);
            totalTimeDisplay.innerText = totalMinutes >= 60 ? `${hours} 小時 (${totalMinutes}分)` : `${totalMinutes}`;

            // 更新完成進度
            const totalCount = todos.length;
            const completedCount = completedTodos.length;
            progressDisplay.innerText = `${completedCount} / ${totalCount}`;

            // 針對未完成事項進行智慧自動排序
            activeTodos.sort((a, b) => calculateScore(b) - calculateScore(a));

            // 分配今日焦點 (Top 3) 與後續待辦
            const topFocus = activeTodos.slice(0, 3);
            const remainingPending = activeTodos.slice(3);

            // 渲染今日焦點
            if (topFocus.length === 0) {
                focusList.innerHTML = `
                    <div class="bg-[#F2F0EB]/60 border border-dashed border-[#E5DFD3] rounded-xl p-6 text-center text-sm text-[#9E9487]">
                        今天還沒有待辦事項，寫下一件想完成的小事吧 🌿
                    </div>
                `;
            } else {
                topFocus.forEach((todo) => {
                    focusList.appendChild(createTodoElement(todo, true));
                });
            }

            // 渲染後續待辦
            if (remainingPending.length === 0 && topFocus.length > 0) {
                pendingList.innerHTML = `
                    <div class="text-xs text-[#9E9487] text-center py-2">
                        目前沒有其他後續待辦，太棒了！✨
                    </div>
                `;
            } else if (remainingPending.length === 0 && topFocus.length === 0) {
                pendingList.innerHTML = '';
            } else {
                remainingPending.forEach((todo) => {
                    pendingList.appendChild(createTodoElement(todo, false));
                });
            }

            // 渲染已完成歷史清單
            if (completedTodos.length === 0) {
                completedList.innerHTML = `
                    <div class="text-xs text-[#A39B90] text-center py-3">
                        尚未有已完成的紀錄，完成任務後會出現在這裡。
                    </div>
                `;
            } else {
                completedTodos.slice().reverse().forEach((todo) => {
                    const div = document.createElement('div');
                    div.className = 'bg-[#F2F0EB]/40 border border-[#E5DFD3] rounded-xl p-3 flex items-center justify-between opacity-70 transition-all-custom';
                    div.innerHTML = `
                        <div class="flex items-center space-x-3 line-through text-[#8C8275] text-sm">
                            <input type="checkbox" checked onchange="toggleTodo('${todo.id}')" class="w-4 h-4 accent-[#786D60] cursor-pointer rounded-xs">
                            <span>${escapeHtml(todo.title)}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs bg-[#E5DFD3]/60 text-[#786D60] px-2 py-0.5 rounded-md">⏱ ${formatDuration(todo.duration)}</span>
                            <button onclick="deleteTodo('${todo.id}')" class="text-xs text-[#A39B90] hover:text-red-500 cursor-pointer px-1">刪除</button>
                        </div>
                    `;
                    completedList.appendChild(div);
                });
            }
        }

        // 建立待辦項目 DOM 節點
        function createTodoElement(todo, isFocus) {
            const div = document.createElement('div');
            div.className = `bg-[#FDFBF7] border ${isFocus ? 'border-[#C2B5A5] shadow-xs' : 'border-[#E5DFD3]'} rounded-xl p-3.5 flex items-center justify-between transition-all-custom hover:border-[#A39B90]`;
            
            div.innerHTML = `
                <div class="flex items-center space-x-3">
                    <input type="checkbox" onchange="toggleTodo('${todo.id}')" class="w-4 h-4 accent-[#786D60] cursor-pointer rounded-xs">
                    <span class="text-sm font-medium text-[#4A453F]">${escapeHtml(todo.title)}</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="adjustDuration('${todo.id}')" title="點擊切換時長" class="text-xs bg-[#F2F0EB] hover:bg-[#E5DFD3] text-[#786D60] px-2.5 py-1 rounded-md transition-all-custom cursor-pointer">
                        ⏱ ${formatDuration(todo.duration)}
                    </button>
                    <button onclick="deleteTodo('${todo.id}')" class="text-xs text-[#B5ADA3] hover:text-[#786D60] cursor-pointer px-1">✕</button>
                </div>
            `;
            return div;
        }

        // 格式化時間顯示
        function formatDuration(minutes) {
            if (minutes >= 60) {
                const h = (minutes / 60).toFixed(1);
                return h.endsWith('.0') ? `${parseInt(h)} 小時` : `${h} 小時`;
            }
            return `${minutes} 分鐘`;
        }

        // XSS 防護
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 表單提交事件 (新增待辦事項)
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const rawText = todoInput.value;
            if (!rawText.trim()) return;

            const { title, duration } = parseDurationAndTitle(rawText);

            const newTodo = {
                id: Date.now().toString(),
                title: title,
                duration: duration,
                completed: false,
                createdAt: Date.now()
            };

            todos.push(newTodo);
            saveTodos();
            todoInput.value = '';
            render();
        });

        // 切換完成狀態
        window.toggleTodo = function(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                render();
            }
        };

        // 快捷調整時長 (點擊時鐘標籤以循環切換 15m -> 30m -> 60m -> 120m)
        window.adjustDuration = function(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                const steps = [15, 30, 45, 60, 90, 120];
                const currentIndex = steps.indexOf(todo.duration);
                const nextIndex = (currentIndex + 1) % steps.length;
                todo.duration = steps[nextIndex];
                saveTodos();
                render();
            }
        };

        // 刪除單一項目
        window.deleteTodo = function(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            render();
        };

        // 清除已完成歷史
        clearHistoryBtn.addEventListener('click', () => {
            todos = todos.filter(t => !t.completed);
            saveTodos();
            render();
        });

        // 初始渲染
        render();
    </script>
</body>
</html>
